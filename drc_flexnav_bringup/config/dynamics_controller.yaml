# Watch-out: The indentation here is relevant to the semantic!

# model_parameters = [K5, K6, K7, K8, Kv, Kw]
# pid: [kp, ki, kd, umin, umax, tau]
# effort_limit: [min, max]

dynamics_controller:
  ros__parameters:
    type: "drc_flexnav_controllers/DynamicsController"
    command_joints:
      - left_motor_joint
      - right_motor_joint
    interface_name: effort
    # linear_vel_pid: [2.667, 1.778, 0.0, -6.0, 6.0, 0.0] # Anti-windup limits: linear accel reference
    angular_vel_pid: [2.667, 1.778, 0.0, -6.0, 6.0, 0.0] # Anti-windup limits: angular accel reference
    linear_vel_pid: [1.0, 1.5, 0.0, -6.0, 6.0, 0.0] # Anti-windup limits: linear accel reference
    # angular_vel_pid: [0.75, 1.25, 0.0, -6.0, 6.0, 0.0] # Anti-windup limits: angular accel reference
    # linear_vel_pid: [4.0, 4.0, 0.0, -10.0, 10.0, 0.0]
    # angular_vel_pid: [4.0, 4.0, 0.0, -10.0, 10.0, 0.0]
    # model_parameters: [-0.4950, 0.0204, 0.0035, -0.0029, 0.0167, 1.9991]  # friction 100
    model_parameters: [-0.9960, 0.3593, 0.3234, 0.2330, -0.3743, -0.6282]

    effort_limit: [-5.0, 5.0] # [Nm]
    linear_velocity_limit: 1.5 # [m/s]
    angular_velocity_limit: 0.785 # [rad/s]
    base_frame_id: flexnav_origin
    priority: 99
    odometer_name: odometer
    odometer_interfaces:
      - twist.linear.x
      - twist.linear.y
      - twist.angular.z
      - pose.orientation.x
      - pose.orientation.y
      - pose.orientation.z
      - pose.orientation.w
    odom_topic: "/odom"
    use_odom_topic: false
    nmt_interface_name: nmt_state
    motor_configured_interface_name: motor_configured

joint_state_broadcaster:
  ros__parameters:
    type: joint_state_broadcaster/JointStateBroadcaster

odometry_broadcaster:
  ros__parameters:
    type: "drc_flexnav_controllers/OdometryBroadcaster"
    sensor_name: odometer
    sensor_interfaces:
      - pose.position.x
      - pose.position.y
      - pose.position.z
      - pose.orientation.x
      - pose.orientation.y
      - pose.orientation.z
      - pose.orientation.w
      - twist.linear.x
      - twist.linear.y
      - twist.linear.z
      - twist.angular.x
      - twist.angular.y
      - twist.angular.z
    odom_topic: /odom
    tf_topic: /tf
    publish_odom_to_tf: True
    odom_frame_id: odom
    base_frame_id: base
    gpio_name: siemens_et200sp_gpio
    gpio_state_interfaces:
      - time_stamp
      - delta_t
      - plc_connected
      - last_plc_read_write_time
    use_siemens_time_stamp: false
