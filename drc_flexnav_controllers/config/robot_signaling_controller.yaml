robot_signaling_controller:
  ros__parameters:
    type: "drc_flexnav_controllers/RobotSignalingController"
    gpio_name: siemens_et200sp_gpio
    gpio_interfaces:
      - green_front_light
      - green_rear_light
      - red_front_light
      - red_rear_light
      - left_light
      - right_light
      - buzzer
    gpio_state_interfaces:
      - time_stamp
      - delta_t
      - plc_connected
      - last_plc_read_write_time
