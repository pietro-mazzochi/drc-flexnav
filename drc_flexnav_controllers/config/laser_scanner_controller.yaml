laser_scanner_controller:
  ros__parameters:
    type: "drc_flexnav_controllers/LaserScannerController"
    gpio_name: siemens_et200sp_gpio
    gpio_interfaces:
      - ls_config
    gpio_state_interfaces:
      - time_stamp
      - delta_t
      - is_emergency_lock
      - plc_connected
      - last_plc_read_write_time
