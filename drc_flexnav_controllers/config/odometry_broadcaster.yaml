odometry_broadcaster:
  ros__parameters:
    type: "drc_flexnav_controllers/OdometryBroadcaster"
    sensor_name: odometer
    sensor_interfaces:
      - pose.position.x
      - pose.position.y
      - pose.position.z
      - pose.orientation.x
      - pose.orientation.y
      - pose.orientation.z
      - pose.orientation.w
      - twist.linear.x
      - twist.linear.y
      - twist.linear.z
      - twist.angular.x
      - twist.angular.y
      - twist.angular.z
    odom_topic: /raw_odom
    tf_topic: /tf
    publish_odom_to_tf: false
    odom_frame_id: odom
    base_frame_id: base_footprint
    gpio_name: siemens_et200sp_gpio
    gpio_state_interfaces:
      - time_stamp
      - delta_t
      - plc_connected
      - last_plc_read_write_time
    use_siemens_time_stamp: false
