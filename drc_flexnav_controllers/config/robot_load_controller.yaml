robot_load_controller:
  ros__parameters:
    type: "drc_flexnav_controllers/RobotLoadController"
    gpio_name: siemens_et200sp_gpio
    gpio_interfaces:
      - load_unload_timeout_seconds
      - load_command
    gpio_state_interfaces:
      - time_stamp
      - delta_t
      - table_error
      - load_error
      - unload_error
      - table_front_load_sensor
      - table_rear_load_sensor
      - loaded
      - plc_connected
      - last_plc_read_write_time
